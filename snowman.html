<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Snowman</title>

    <style>
        #myDrawing{
            border: solid 1px green;
            background-color: #e3f2fd; /* Light winter sky background */
        }

        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center; /* Centers on both X and Y axes */
        }
    </style>
</head>
<body>
    <canvas height="500" width="1000" id="myDrawing"></canvas>

    <script>
        const canvas = document.getElementById("myDrawing");
        const ctx = canvas.getContext("2d");
        const snowX = canvas.width / 2; // Center of the 1000px canvas (500px)

        // Bottom snow mound/body
        ctx.beginPath();
        ctx.arc(snowX, 700, 350, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#cfd8dc';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Lower torso
        ctx.beginPath();
        ctx.arc(snowX, 370, 75, 0, Math.PI * 2); 
        ctx.fillStyle = '#ffffff'; 
        ctx.fill();
        ctx.strokeStyle = '#b0bec5';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Middle torso
        ctx.beginPath();
        ctx.arc(snowX, 275, 55, 0, Math.PI * 2); 
        ctx.fillStyle = '#ffffff'; 
        ctx.fill();
        ctx.stroke();

        // Head
        ctx.beginPath();
        ctx.arc(snowX, 200, 38, 0, Math.PI * 2); 
        ctx.fillStyle = '#ffffff'; 
        ctx.fill();
        ctx.stroke();

        // Left Stick Hand
        ctx.beginPath();
        ctx.moveTo(snowX - 45, 265);
        ctx.lineTo(snowX - 100, 240);
        // Small twigs/fingers on the left hand
        ctx.lineTo(snowX - 115, 225);
        ctx.moveTo(snowX - 100, 240);
        ctx.lineTo(snowX - 115, 250);
        ctx.strokeStyle = '#5d4037'; // Brown stick color
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Right Stick Hand
        ctx.beginPath();
        ctx.moveTo(snowX + 45, 265);
        ctx.lineTo(snowX + 100, 240);
        // Small twigs/fingers on the right hand
        ctx.lineTo(snowX + 115, 225);
        ctx.moveTo(snowX + 100, 240);
        ctx.lineTo(snowX + 115, 250);
        ctx.strokeStyle = '#5d4037';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Buttons
        const buttons = [255, 275, 295];
        buttons.forEach(yCoord => {
            ctx.beginPath();
            ctx.arc(snowX, yCoord, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#37474f';
            ctx.fill();
        });
   
        // Eyes
        ctx.beginPath();
        ctx.arc(snowX - 10, 190, 4, 0, Math.PI * 2);
        ctx.arc(snowX + 10, 190, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#37474f';
        ctx.fill();

        // Carrot nose
        ctx.beginPath();
        ctx.moveTo(snowX, 200);
        ctx.lineTo(snowX + 25, 205);
        ctx.lineTo(snowX, 210);
        ctx.fillStyle = '#ff9800';
        ctx.fill();
        ctx.strokeStyle = '#f57c00';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Smile
        ctx.beginPath();
        ctx.arc(snowX, 200, 18, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.strokeStyle = '#37474f';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Hat brim
        ctx.beginPath();
        ctx.moveTo(snowX - 30, 162);
        ctx.lineTo(snowX + 30, 162);
        ctx.strokeStyle = '#263238';
        ctx.lineWidth = 6;
        ctx.stroke();

        // Hat top
        ctx.beginPath();
        ctx.moveTo(snowX - 18, 162);
        ctx.lineTo(snowX - 18, 115);
        ctx.lineTo(snowX + 18, 115);
        ctx.lineTo(snowX + 18, 162);
        ctx.fillStyle = '#263238';
        ctx.fill();
        ctx.stroke();
    </script>
</body>
</html>
