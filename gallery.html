<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrian Files — Gallery</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Times New Roman', Times, serif; 
            text-align: center; 
        }
        nav { 
            background-color: #fcc200; 
            display: flex; 
            justify-content: flex-start; 
            padding: 0 20px; 
        }
        nav a { 
            color: #ffffff; 
            text-decoration: none; 
            padding: 14px 20px; 
            font-size: 16px; 
        }
        nav a:hover, nav a.active { 
            background-color: #b78727; 
            border-bottom: 3px solid #ffcc00; 
        }
        .container { 
            max-width: 800px; 
            margin: 60px auto 0 auto; 
            padding: 20px; 
        }
        h1 { 
            font-size: 36px; 
            margin-bottom: 20px; 
            font-weight: bold; 
        }
        h2 { 
            font-size: 26px; 
            font-weight: normal; 
        }

        /* Carousel styles */
        h1.myFont {
            text-align: center;
            margin: 30px 0 20px 0;
            color: #333333;
            font-size: 36px;
        }

        #carousel-container {
            max-width: 800px;
            margin: 0 auto;
            border: 2px solid #fcc200;
            background: #000000;
        }

        #carousel {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000000;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .slide.active {
            opacity: 1;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-footer {
            background: #111111;
            padding: 15px;
            text-align: center;
            border-top: 2px solid #fcc200;
        }
        .caption {
            color: #ffffff;
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .dots {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            border: none;
        }
        .dot.active {
            background: #fcc200;
            box-shadow: 0 0 4px rgba(0,0,0,0.4);
        }

        .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.8);
            border: none;
            font-size: 1.5rem;
            padding: 8px 12px;
            cursor: pointer;
            z-index: 10;
        }
        .prev { left: 10px; }
        .next { right: 10px; }
        .prev:hover, .next:hover {
            background: #fcc200;
            color: #000000;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="container">
        <h1 class="myFont">Gallery</h1>
        
        <div id="carousel-container">
            <div id="carousel">
                <div class="slide active">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvBstA31pGpJ_QVgXA_1meHIf_EmwS11J-nfChrjgw752n2dqmh_h35cQ&s=10" alt="My Dream Bike">
                </div>
                <div class="slide">
                    <img src="https://momath.org/wp-content/uploads/2022/01/Chess-Challenge.jpg" alt="My peace of mind">
                </div>
                <div class="slide">
                    <img src="https://cruise.blog/sites/default/files/2021-07/56862242_2263351210594631_7113351095065247744_o.jpg" alt="My Future Job">
                </div>
                <div class="slide">
                    <img src="https://www.bordersofadventure.com/wp-content/uploads/2020/08/View-of-Bern-from-Clocktower-scaled.jpg" alt="Dream Country Switzerland">
                </div>

                <button class="prev" aria-label="Previous slide">❮</button>
                <button class="next" aria-label="Next slide">❯</button>
            </div>
            <div class="carousel-footer">
                <div class="caption">First Model</div>
                <div class="dots"></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(function () {
            const $slides = $(".slide");
            const $dots = $(".dots");
            const $caption = $(".carousel-footer .caption");
            const total = $slides.length;
            let current = 0;
            let timer;

            for (let i = 0; i < total; i++) {
                $dots.append(`<button class="dot" data-index="${i}" aria-label="Go to slide ${i+1}"></button>`);
            }
            const $dot = $(".dot");

            function showSlide(index) {
                $slides.stop(true, true).fadeOut(500).removeClass("active");
                const $currentSlide = $slides.eq(index).stop(true, true).fadeIn(500).addClass("active");
                $dot.removeClass("active").eq(index).addClass("active");
                $caption.text($currentSlide.find("img").attr("alt"));
                
                current = index;
            }

            function startAutoplay() {
                stopAutoplay();
                timer = setInterval(() => {
                    showSlide((current + 1) % total);
                }, 4000);
            }
            function stopAutoplay() {
                clearInterval(timer);
            }

            $slides.hide().eq(0).show();
            $dot.eq(0).addClass("active");
            $caption.text($slides.eq(0).find("img").attr("alt"));
            startAutoplay();

            $(".next").on("click", () => {
                showSlide((current + 1) % total);
            });
            $(".prev").on("click", () => {
                showSlide((current - 1 + total) % total);
            });

            $dots.on("click", ".dot", function () {
                showSlide(parseInt($(this).data("index")));
            });

            $("#carousel-container").on("mouseenter", stopAutoplay).on("mouseleave", startAutoplay);

            $(document).on("keydown", (e) => {
                if (e.key === "ArrowRight") showSlide((current + 1) % total);
                if (e.key === "ArrowLeft") showSlide((current - 1 + total) % total);
            });
        });
    </script>
</body>
</html>
