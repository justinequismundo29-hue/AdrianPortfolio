<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Times New Roman', Times, serif;
      background: #ffffff;
      text-align: center;
    }
    
    /* Navigation style */
    nav { 
      background-color: #fcc200; 
      display: flex; 
      justify-content: flex-start; 
      padding: 0 20px; 
    }
    nav a { 
      color: #ffffff; 
      text-decoration: none; 
      padding: 14px 20px; 
      font-size: 16px; 
    }
    nav a:hover, nav a.active { 
      background-color: #b78727; 
      border-bottom: 3px solid #ffcc00; 
    }

    h1.myFont {
      text-align: center;
      margin: 30px 0 20px 0;
      color: #333333;
      font-size: 36px;
    }

    /* Outer container holding both the picture and the bottom info bar */
    #carousel-container {
      max-width: 800px;
      margin: 0 auto;
      border: 2px solid #fcc200;
      background: #000000;
    }

    #carousel {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000000;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .slide.active {
      opacity: 1;
    }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Keeps the photo full size */
    }

    /* Footer section placed completely UNDER the picture */
    .carousel-footer {
      background: #111111;
      padding: 15px;
      text-align: center;
      border-top: 2px solid #fcc200;
    }
    .caption {
      color: #ffffff;
      font-size: 1.1rem;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      cursor: pointer;
      border: none;
    }
    .dot.active {
      background: #fcc200;
      box-shadow: 0 0 4px rgba(0,0,0,0.4);
    }

    .prev, .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.8);
      border: none;
      font-size: 1.5rem;
      padding: 8px 12px;
      cursor: pointer;
      z-index: 10;
    }
    .prev { left: 10px; }
    .next { right: 10px; }
    .prev:hover, .next:hover {
      background: #fcc200;
      color: #000000;
    }
  </style>
</head>
