<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Times New Roman', Times, serif;
      background: #ffffff;
      text-align: center;
    }
    
    /* Navigation style */
    nav { 
      background-color: #fcc200; 
      display: flex; 
      justify-content: flex-start; 
      padding: 0 20px; 
    }
    nav a { 
      color: #ffffff; 
      text-decoration: none; 
      padding: 14px 20px; 
      font-size: 16px; 
    }
    nav a:hover, nav a.active { 
      background-color: #b78727; 
      border-bottom: 3px solid #ffcc00; 
    }

    h1.myFont {
      text-align: center;
      margin: 30px 0 20px 0;
      color: #333333;
      font-size: 36px;
    }

    /* Outer container holding both the picture and the bottom info bar */
    #carousel-container {
      max-width: 800px;
      margin: 0 auto;
      border: 2px solid #fcc200;
      background: #000000;
    }

    #carousel {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000000;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .slide.active {
      opacity: 1;
    }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Keeps the photo full size */
    }

    /* Footer section placed completely UNDER the picture */
    .carousel-footer {
      background: #111111;
      padding: 15px;
      text-align: center;
      border-top: 2px solid #fcc200;
    }
    .caption {
      color: #ffffff;
      font-size: 1.1rem;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      cursor: pointer;
      border: none;
    }
    .dot.active {
      background: #fcc200;
      box-shadow: 0 0 4px rgba(0,0,0,0.4);
    }

    .prev, .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.8);
      border: none;
      font-size: 1.5rem;
      padding: 8px 12px;
      cursor: pointer;
      z-index: 10;
    }
    .prev { left: 10px; }
    .next { right: 10px; }
    .prev:hover, .next:hover {
      background: #fcc200;
      color: #000000;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html" class="active">Gallery</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
  </nav>

  <h1 class="myFont">My Big Bikes</h1>

  <!-- Carousel Container with Picture on top and Info Bar UNDERneath -->
  <div id="carousel-container">
    <div id="carousel">
      <div class="slide active">
        <img src="https://nerostickers.com/cdn/shop/files/IMG_0158.webp?v=1752434823" alt="First Model">
      </div>
      <div class="slide">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSB4fqSO5YjS8a6xiqzlsVb4kJ3j6VfLcNH0twQo-EAEU4AW1KWkxj2PKVB&s=10" alt="Second Model">
      </div>
      <div class="slide">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxeo8qwi9zx5pXoZGLOTbi-lSjlGyDxfd1NWZONtGnrmu-1EplrS7b7Ado&s=10" alt="Third Model">
      </div>
      <div class="slide">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCJZgKSYKSdfRNk-KP4T_08c7TcHhK23V2nvClB-wsOOZVIV74PXOENW7-&s=10" alt="Fourth Model">
      </div>

      <button class="prev" aria-label="Previous slide">❮</button>
      <button class="next" aria-label="Next slide">❯</button>
    </div>

    <!-- Caption and Dots safely underneath the picture -->
    <div class="carousel-footer">
      <div class="caption">First Model</div>
      <div class="dots"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <script>
    $(function () {
      const $slides = $(".slide");
      const $dots = $(".dots");
      const $caption = $(".carousel-footer .caption");
      const total = $slides.length;
      let current = 0;
      let timer;

      for (let i = 0; i < total; i++) {
        $dots.append(`<button class="dot" data-index="${i}" aria-label="Go to slide ${i+1}"></button>`);
      }
      const $dot = $(".dot");

      function showSlide(index) {
        $slides.stop(true, true).fadeOut(500).removeClass("active");
        const $currentSlide = $slides.eq(index).stop(true, true).fadeIn(500).addClass("active");
        $dot.removeClass("active").eq(index).addClass("active");
        
        // Update caption dynamically based on image alt text
        $caption.text($currentSlide.find("img").attr("alt"));
        
        current = index;
      }

      function startAutoplay() {
        stopAutoplay();
        timer = setInterval(() => {
          showSlide((current + 1) % total);
        }, 4000);
      }
      function stopAutoplay() {
        clearInterval(timer);
      }

      $slides.hide().eq(0).show();
      $dot.eq(0).addClass("active");
      $caption.text($slides.eq(0).find("img").attr("alt"));
      startAutoplay();

      $(".next").on("click", () => {
        showSlide((current + 1) % total);
      });
      $(".prev").on("click", () => {
        showSlide((current - 1 + total) % total);
      });

      $dots.on("click", ".dot", function () {
        showSlide(parseInt($(this).data("index")));
      });

      $("#carousel-container").on("mouseenter", stopAutoplay).on("mouseleave", startAutoplay);

      $(document).on("keydown", (e) => {
        if (e.key === "ArrowRight") showSlide((current + 1) % total);
        if (e.key === "ArrowLeft") showSlide((current - 1 + total) % total);
      });
    });
  </script>
</body>
</html>
