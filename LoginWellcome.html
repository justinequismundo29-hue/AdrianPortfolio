<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; max-width: 400px; margin: 0 auto; }
    .inputField { width: 100%; padding: 0.75rem; margin: 0.5rem 0; box-sizing: border-box; }
    button { padding: 0.75rem 1.5rem; margin: 0.5rem 0.5rem 0 0; cursor: pointer; }
    #errorMessage { color: red; margin-top: 1rem; }
    .welcome { color: green; font-size: 1.2rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="loginContainer">
    <form id="loginForm">
      <h2>Login</h2>
      <input type="text" id="username" class="inputField" placeholder="Username" required>
      <input type="password" id="password" class="inputField" placeholder="Password" required>
      <button type="submit" id="btnLogIn">Submit</button>
      <button type="reset">Reset</button>
      <p id="errorMessage"></p>
    </form>
  </div>
  <script>
    const loginForm = document.getElementById('loginForm');
    const loginContainer = document.getElementById('loginContainer');
    const errorMessage = document.getElementById('errorMessage');

    // Correct credentials
    const VALID_USER = "adrian";
    const VALID_PASS = "568871732";

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault(); // Prevent page reload
      const inputUser = document.getElementById('username').value.trim();
      const inputPass = document.getElementById('password').value;

      // First check fields are not empty
      if (inputUser === "" || inputPass === "") {
        errorMessage.textContent = "Please enter both username and password — they cannot be empty!";
        return;
      }

      // Check if credentials match
      if (inputUser === VALID_USER && inputPass === VALID_PASS) {
        // Login successful — show welcome
        loginContainer.innerHTML = `
          <h2 class="welcome">Welcome, ${inputUser}!</h2>
          <p>You have successfully logged in.</p>
        `;
      } else {
        // Wrong credentials — show error
        errorMessage.textContent = "Invalid username or password. Please try again.";
        // Optional: clear password field
        document.getElementById('password').value = "";
      }
    });
  </script>
</body>
</html>
