<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            background: #eef2f8;
            background-image: radial-gradient(circle at top left, #d7e3f4 0%, transparent 55%),
                              radial-gradient(circle at bottom right, #c9d8f0 0%, transparent 55%);
            padding: 2rem;
            color: #1a2c47;
            min-height: 100vh;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .box {
            background: #fafcff;
            border: 2px solid #4a80d6;
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 4px 12px rgba(74, 128, 214, 0.08);
        }
        .box h1 { font-size: 1.25rem; color: #2c59a8; }
        svg { border-radius: 8px; }
        #svg2 { background: linear-gradient(135deg, #254b98, #4a80d6); }
        a { display: inline-block; margin-top: 2rem; color: #2c59a8; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Circle -->
        <div class="box">
            <h1>Circle element</h1>
            <svg viewBox="0 0 200 200" style="border: 2px solid #e86a7a; background: #fff;">
                <circle cx="100" cy="100" r="70" stroke="#2c59a8" stroke-width="5" fill="#a4c2f4"/>
            </svg>
        </div>

        <!-- Group -->
        <div class="box">
            <h1>g element</h1>
            <svg viewBox="0 0 420 220">
                <defs>
                    <linearGradient id="newGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="40%" stop-color="#2c59a8"/>
                        <stop offset="100%" stop-color="#e86a7a"/>
                    </linearGradient>
                </defs>
                <g fill="#fdfdfd" stroke="url(#newGrad)" stroke-width="14" transform="translate(10,10)">
                    <rect width="400" height="200"/>
                    <rect width="200" height="200"/>
                    <rect width="200" height="100"/>
                </g>
            </svg>
        </div>

        <!-- Polygon -->
        <div class="box">
            <h1>Polygon element</h1>
            <svg id="svg2" viewBox="0 0 200 210">
                <polygon points="100,100 15,205 150,7 20,0" fill="#74a3f0" stroke="#f8c45c" stroke-width="3"/>
            </svg>
        </div>

        <!-- Text -->
        <div class="box">
            <h1>Text element</h1>
            <svg viewBox="0 0 160 160" style="background: #fff; border: 1px solid #d4dff2;">
                <text x="10" y="10" fill="#2c59a8" font-weight="bold" transform="rotate(30 20,40)">LoveAndLightTv</text>
                <text x="40" y="40" fill="#d15262" font-weight="bold" transform="rotate(90 10,60)">LionPizzaChicken</text>
            </svg>
        </div>

        <!-- Line -->
        <div class="box">
            <h1>Line element</h1>
            <svg viewBox="0 0 150 150" style="background: #fff;">
                <line x1="10" y1="10" x2="130" y2="130" stroke="#2c59a8" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
    </div>
    <a href="index.html">← Back to Home</a>
</body>
</html>
